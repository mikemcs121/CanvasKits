<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kit Viewer</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #24211d; --muted: #6f6a62; --line: #ddd8cf;
    --accent: #8a4b1f; --accent-soft: #f3e6da; --stage: #e9e6e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19; --panel: #262422; --ink: #ece8e1; --muted: #a39d93; --line: #3a3733;
      --accent: #e3a066; --accent-soft: #3a2e24; --stage: #141312;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 240px 1fr;
  }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  #kits { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  #kits li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  #kits li:hover { background: var(--bg); }
  #kits li.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #kits img { width: 36px; height: 45px; object-fit: cover; border-radius: 3px; background: var(--stage); flex: none; }
  #kits .badge { font-size: 10px; font-weight: 600; color: var(--muted); display: block; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; overflow-y: hidden; flex: none; }
  #tabs button {
    border: 1px solid transparent; border-bottom: none; background: none; color: var(--muted);
    padding: 7px 14px; border-radius: 6px 6px 0 0; cursor: pointer; font: inherit; white-space: nowrap;
  }
  #tabs button:hover { color: var(--ink); }
  #tabs button.active { background: var(--bg); border-color: var(--line); color: var(--ink); font-weight: 600; margin-bottom: -1px; }
  #tabs button.simplified { color: var(--accent); }
  #bar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); flex: none; }
  #bar .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar button, aside h1 button {
    font: inherit; font-size: 12px; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 9px; cursor: pointer;
  }
  #bar button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  #view { flex: 1; min-height: 0; position: relative; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .stage { position: absolute; inset: 0; overflow: auto; display: flex; padding: 16px; }
  .stage img { margin: auto; max-width: 100%; max-height: 100%; cursor: zoom-in; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  .stage.actual img { max-width: none; max-height: none; cursor: zoom-out; }
  .bg-white { background: #fff; } .bg-white img { box-shadow: none; outline: 1px solid #ccc; }
  .bg-dark { background: #2a2826; }
  .bg-check { background: repeating-conic-gradient(#d8d8d8 0 25%, #f4f4f4 0 50%) 0 0 / 20px 20px; }
  .grid { position: absolute; inset: 0; overflow-y: auto; padding: 16px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
  .card:hover { border-color: var(--accent); }
  .card .thumb { height: 170px; display: flex; align-items: center; justify-content: center; background: repeating-conic-gradient(#e2e2e2 0 25%, #f7f7f7 0 50%) 0 0 / 16px 16px; }
  .card .thumb img { max-width: 100%; max-height: 100%; }
  .card .thumb .ext { font-size: 22px; font-weight: 700; color: #888; }
  .card .name { padding: 7px 9px; font-size: 12px; word-break: break-word; }
  .empty { padding: 40px; color: var(--muted); text-align: center; }
  #lightbox { position: fixed; inset: 0; background: rgba(15,14,13,.92); display: none; z-index: 10; }
  #lightbox.open { display: flex; flex-direction: column; }
  #lightbox .lb-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 20px 70px 0; }
  #lightbox img { max-width: 100%; max-height: 100%; background: repeating-conic-gradient(#d8d8d8 0 25%, #f4f4f4 0 50%) 0 0 / 20px 20px; }
  #lightbox .cap { color: #ddd; text-align: center; padding: 10px; font-size: 13px; }
  #lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 34px; color: #fff; background: none; border: 0; cursor: pointer; padding: 20px; opacity: .7; }
  #lightbox .nav:hover { opacity: 1; }
  #lightbox .prev { left: 4px; } #lightbox .next { right: 4px; }
  #lightbox .close { position: absolute; top: 8px; right: 14px; font-size: 26px; color: #fff; background: none; border: 0; cursor: pointer; }
</style>
</head>
<body>
<aside>
  <h1>Kit Viewer <button id="reload" title="Rescan the project folder">Refresh</button></h1>
  <ul id="kits"></ul>
</aside>
<main>
  <nav id="tabs"></nav>
  <div id="bar"><span class="path" id="path"></span><span id="tools"></span><button id="reveal">Show in Explorer</button></div>
  <div id="view"></div>
</main>
<div id="lightbox">
  <button class="close" title="Close (Esc)">&times;</button>
  <button class="nav prev" title="Previous (←)">&#8249;</button>
  <div class="lb-img"><img alt=""></div>
  <div class="cap"></div>
  <button class="nav next" title="Next (→)">&#8250;</button>
</div>
<script>
const $ = s => document.querySelector(s);
const fileUrl = p => '/files/' + p.split('/').map(encodeURIComponent).join('/');
const baseName = p => p.split('/').pop();
const ext = p => (p.match(/\.([^.\/]+)$/) || [, ''])[1].toLowerCase();
const isImage = p => ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext(p));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let kits = [], kit = null, tabs = [], tabIndex = 0, currentPath = '', bg = store.get('bg') || 'white';

function labelFor(p) {
  const n = baseName(p);
  if (/-finished-reference-/.test(n) && ext(n) === 'pdf') return 'Reference';
  if (/-painting-guide-/.test(n) && ext(n) === 'pdf') return 'Guide';
  if (/-outline-/.test(n) && ext(n) === 'svg') return 'Outline';
  return n;
}

function buildTabs(k) {
  const t = [];
  if (k.reference) t.push({ label: 'Reference', kind: 'file', path: k.reference });
  if (k.guide) t.push({ label: 'Guide', kind: 'file', path: k.guide });
  if (k.outline) t.push({ label: 'Outline', kind: 'file', path: k.outline });
  t.push({ label: `Assets (${k.assets.length})`, kind: 'gallery', files: k.assets, path: k.path + '/assets' });
  const s = k.simplified;
  if (s) {
    const order = { Reference: 0, Guide: 1, Outline: 2 };
    const files = [...s.files].sort((a, b) => (order[labelFor(a)] ?? 9) - (order[labelFor(b)] ?? 9) || a.localeCompare(b));
    for (const f of files) t.push({ label: 'Simplified ' + labelFor(f), kind: 'file', path: f, simplified: true });
    for (const d of s.folders) t.push({ label: `Simplified ${d.name} (${d.files.length})`, kind: 'gallery', files: d.files, path: d.path, simplified: true });
  }
  return t;
}

function renderKits() {
  const ul = $('#kits');
  ul.innerHTML = '';
  kits.forEach(k => {
    const li = document.createElement('li');
    const preview = k.assets.find(a => /finished-painting-preview/.test(a)) || k.assets.find(isImage);
    const img = document.createElement('img');
    if (preview) img.src = fileUrl(preview);
    img.alt = '';
    const text = document.createElement('div');
    text.textContent = k.name;
    if (k.simplified) {
      const b = document.createElement('span');
      b.className = 'badge'; b.textContent = '+ simplified';
      text.appendChild(b);
    }
    li.append(img, text);
    li.onclick = () => selectKit(k.name);
    li.classList.toggle('active', kit && kit.name === k.name);
    ul.appendChild(li);
  });
}

function selectKit(name, keepTab) {
  kit = kits.find(k => k.name === name) || kits[0];
  if (!kit) { $('#view').innerHTML = '<div class="empty">No kits found.</div>'; return; }
  store.set('kit', kit.name);
  const prevLabel = tabs[tabIndex] && tabs[tabIndex].label.replace(/ \(\d+\)$/, '');
  tabs = buildTabs(kit);
  let i = 0;
  if (keepTab && prevLabel) i = Math.max(0, tabs.findIndex(t => t.label.replace(/ \(\d+\)$/, '') === prevLabel));
  renderKits();
  selectTab(i);
}

function selectTab(i) {
  tabIndex = Math.max(0, Math.min(i, tabs.length - 1));
  const nav = $('#tabs');
  nav.innerHTML = '';
  tabs.forEach((t, j) => {
    const b = document.createElement('button');
    b.textContent = t.label;
    b.title = t.path;
    b.className = (j === tabIndex ? 'active ' : '') + (t.simplified ? 'simplified' : '');
    b.onclick = () => selectTab(j);
    nav.appendChild(b);
  });
  showTab(tabs[tabIndex]);
}

function showTab(t) {
  const view = $('#view'), tools = $('#tools');
  view.innerHTML = ''; tools.innerHTML = '';
  currentPath = t.path;
  $('#path').textContent = t.path;
  if (t.kind === 'gallery') return showGallery(view, t.files);
  const e = ext(t.path);
  if (e === 'pdf') {
    const f = document.createElement('iframe');
    f.src = fileUrl(t.path) + '#view=Fit';
    view.appendChild(f);
  } else if (isImage(t.path)) {
    showImage(view, tools, t.path);
  } else {
    const f = document.createElement('iframe');
    f.src = fileUrl(t.path);
    f.style.background = '#fff';
    view.appendChild(f);
  }
}

function showImage(view, tools, path) {
  const stage = document.createElement('div');
  stage.className = 'stage bg-' + bg;
  const img = document.createElement('img');
  img.src = fileUrl(path);
  img.title = 'Click to toggle fit / actual size';
  img.onclick = () => stage.classList.toggle('actual');
  stage.appendChild(img);
  view.appendChild(stage);
  for (const [key, name] of [['white', 'White'], ['check', 'Transparent'], ['dark', 'Dark']]) {
    const b = document.createElement('button');
    b.textContent = name;
    b.className = bg === key ? 'on' : '';
    b.onclick = () => { bg = key; store.set('bg', bg); showTab(tabs[tabIndex]); };
    tools.appendChild(b);
    tools.append(' ');
  }
}

function showGallery(view, files) {
  if (!files.length) { view.innerHTML = '<div class="empty">This folder is empty or missing.</div>'; return; }
  const grid = document.createElement('div');
  grid.className = 'grid';
  files.forEach((f, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.title = f;
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if (isImage(f)) {
      const img = document.createElement('img');
      img.loading = 'lazy'; img.src = fileUrl(f); img.alt = '';
      thumb.appendChild(img);
    } else {
      thumb.innerHTML = `<span class="ext">${ext(f).toUpperCase() || 'FILE'}</span>`;
    }
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = baseName(f);
    card.append(thumb, name);
    card.onclick = () => isImage(f) ? openLightbox(files.filter(isImage), f) : window.open(fileUrl(f));
    grid.appendChild(card);
  });
  view.appendChild(grid);
}

let lbFiles = [], lbIndex = 0;
function openLightbox(files, f) { lbFiles = files; lbIndex = files.indexOf(f); $('#lightbox').classList.add('open'); drawLightbox(); }
function drawLightbox() {
  const f = lbFiles[lbIndex];
  $('#lightbox img').src = fileUrl(f);
  $('#lightbox .cap').textContent = `${baseName(f)}  ·  ${lbIndex + 1} of ${lbFiles.length}`;
}
function stepLightbox(d) { lbIndex = (lbIndex + d + lbFiles.length) % lbFiles.length; drawLightbox(); }
function closeLightbox() { $('#lightbox').classList.remove('open'); }
$('#lightbox .prev').onclick = () => stepLightbox(-1);
$('#lightbox .next').onclick = () => stepLightbox(1);
$('#lightbox .close').onclick = closeLightbox;
$('#lightbox').onclick = e => { if (e.target.id === 'lightbox' || e.target.classList.contains('lb-img')) closeLightbox(); };

document.addEventListener('keydown', e => {
  if ($('#lightbox').classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') stepLightbox(-1);
    if (e.key === 'ArrowRight') stepLightbox(1);
    return;
  }
  if (e.ctrlKey && e.key === 'Tab') { e.preventDefault(); selectTab((tabIndex + (e.shiftKey ? -1 : 1) + tabs.length) % tabs.length); }
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const i = kits.indexOf(kit) + (e.key === 'ArrowUp' ? -1 : 1);
    if (kits[i]) selectKit(kits[i].name, true);
  }
});

$('#reveal').onclick = () => currentPath && fetch('/api/reveal?path=' + encodeURIComponent(currentPath));
$('#reload').onclick = () => load(true);

async function load(keepTab) {
  kits = await (await fetch('/api/kits')).json();
  const hash = new URLSearchParams(location.hash.slice(1));
  if (!keepTab && hash.get('kit')) {
    selectKit(hash.get('kit'));
    const t = tabs.findIndex(t => t.label.startsWith(hash.get('tab') || ''));
    if (t >= 0) selectTab(t);
    return;
  }
  selectKit((kit && kit.name) || store.get('kit'), keepTab);
}

// Keep the launcher alive while this window is open.
setInterval(() => fetch('/api/ping').catch(() => {}), 5000);
fetch('/api/ping');
addEventListener('pagehide', () => navigator.sendBeacon('/api/bye'));

load(false);
</script>
</body>
</html>
