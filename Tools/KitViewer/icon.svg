<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Kit Viewer icon: a portrait 8x10 canvas with a small painted scene and a brush -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a95c27"/>
      <stop offset="1" stop-color="#7a3d16"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7cc"/>
      <stop offset="1" stop-color="#f3d3a2"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b2a1c"/>
      <stop offset="0.5" stop-color="#5a4029"/>
      <stop offset="1" stop-color="#2e2016"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a6"/>
      <stop offset="0.45" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#8a9096"/>
    </linearGradient>
    <clipPath id="art"><rect x="62" y="46" width="112" height="140"/></clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- canvas: 4:5 portrait, with shadow and stretched-canvas edge -->
  <rect x="58" y="46" width="120" height="150" rx="4" fill="#000" opacity="0.28" transform="translate(5 7)"/>
  <rect x="54" y="38" width="128" height="158" rx="4" fill="#fbf8f2"/>
  <g clip-path="url(#art)">
    <rect x="62" y="46" width="112" height="140" fill="url(#sky)"/>
    <circle cx="140" cy="84" r="17" fill="#f2b33d"/>
    <path d="M62 140 Q92 104 124 132 T174 122 V186 H62 Z" fill="#d9692a"/>
    <path d="M62 160 Q100 132 136 154 T174 150 V186 H62 Z" fill="#4f6b3a"/>
    <path d="M62 176 Q110 162 174 174 V186 H62 Z" fill="#344a27"/>
  </g>
  <rect x="62" y="46" width="112" height="140" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>

  <!-- brush, laid diagonally across the lower right corner -->
  <g transform="rotate(38 176 176)">
    <rect x="167" y="150" width="18" height="96" rx="9" fill="url(#handle)"/>
    <rect x="165" y="124" width="22" height="30" rx="3" fill="url(#ferrule)"/>
    <path d="M165 126 C165 104 170 90 176 78 C182 90 187 104 187 126 Z" fill="#c6531e"/>
    <path d="M171 118 C172 104 174 94 176 86" stroke="#ef8a4b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
